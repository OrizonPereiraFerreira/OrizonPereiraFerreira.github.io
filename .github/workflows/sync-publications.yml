# Looks for new articles on OpenAlex (by ORCID) every Monday and, when it finds any,
# opens a pull request with the changes to js/data.js. GitHub emails you about it;
# the page only changes after you press "Merge pull request".
# Run it by hand: Actions tab > "Sync publications" > "Run workflow",
# or in a terminal: gh workflow run sync-publications.yml
name: Sync publications

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 08:00 in Brasília
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look for new publications
        id: sync
        run: |
          python3 scripts/sync_publications.py | tee changes.txt
          {
            echo "summary<<EOF"
            sed 's/^/- /' changes.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm changes.txt

      - name: Open a pull request for approval
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync-publications
          delete-branch: true
          add-paths: js/data.js
          commit-message: Update publications from OpenAlex
          title: "Publications: updates found on OpenAlex"
          body: |
            @OrizonPereiraFerreira, the weekly check found changes for the Publications page:

            ${{ steps.sync.outputs.summary }}

            Review the **Files changed** tab. Press **Merge pull request** to publish them on the site,
            or **Close pull request** to discard. To never propose an article again, add its DOI to
            `scripts/sync-ignore.txt`.
